<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
		<meta name="theme-color" content="#100f23">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="description" content="A hundred doors, one a day. Tiny games in rare genres, each with its own song.">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	background: #100f23;
	overflow: hidden;
	overscroll-behavior: none;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

body {
	color: #f4f1ea;
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

#canvas {
	display: block;
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
}

#canvas:focus {
	outline: none;
}

#safe-probe {
	position: fixed;
	visibility: hidden;
	pointer-events: none;
	padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

#status {
	position: fixed;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 28px;
	background: radial-gradient(ellipse at 50% 120%, #2a2752 0%, #100f23 70%);
	z-index: 2;
	transition: opacity 0.4s ease;
}

#status.fade {
	opacity: 0;
}

.door {
	position: relative;
	width: 108px;
	height: 150px;
	border-radius: 54px 54px 6px 6px;
	background: #4a2c19;
	box-shadow: 0 0 0 8px #2c1a0f, 0 18px 40px rgba(0, 0, 0, 0.5);
	perspective: 400px;
	overflow: hidden;
}

.door::before {
	content: '';
	position: absolute;
	inset: 0;
	background: radial-gradient(circle at 50% 60%, #ffe9a8 0%, #f2c14e 35%, #c98f1b 100%);
}

.door .leaf {
	position: absolute;
	inset: 0;
	border-radius: 54px 54px 6px 6px;
	background: #b07a47;
	transform-origin: left center;
	animation: swing 2.4s ease-in-out infinite alternate;
	box-shadow: inset -10px 0 18px rgba(0, 0, 0, 0.25);
}

.door .leaf::after {
	content: '';
	position: absolute;
	right: 14px;
	top: 52%;
	width: 10px;
	height: 10px;
	border-radius: 50%;
	background: #c98f1b;
}

@keyframes swing {
	from { transform: rotateY(0deg); }
	to { transform: rotateY(-62deg); }
}

@media (prefers-reduced-motion: reduce) {
	.door .leaf { animation: none; transform: rotateY(-30deg); }
}

#status-title {
	font-size: 34px;
	font-weight: 700;
	letter-spacing: 0.04em;
	color: #f2c14e;
}

#status-progress {
	width: min(60vw, 360px);
	height: 12px;
	border-radius: 6px;
	background: #2a2752;
	overflow: hidden;
}

#status-bar {
	width: 0%;
	height: 100%;
	background: #f2c14e;
	transition: width 0.2s ease;
}

#status-progress.indeterminate #status-bar {
	width: 30%;
	animation: slide 1.2s ease-in-out infinite;
}

@keyframes slide {
	from { transform: translateX(-100%); }
	to { transform: translateX(340%); }
}

#status-notice {
	display: none;
	max-width: 80vw;
	padding: 16px 20px;
	border-radius: 12px;
	background: #5b3943;
	border: 1px solid #9b3943;
	line-height: 1.4;
	text-align: center;
	white-space: pre-line;
}

#rotate {
	position: fixed;
	inset: 0;
	z-index: 3;
	display: none;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 18px;
	padding: 24px;
	text-align: center;
	background: rgba(16, 15, 35, 0.96);
	font-size: 20px;
	line-height: 1.4;
}

#rotate .phone {
	width: 56px;
	height: 92px;
	border: 5px solid #f4f1ea;
	border-radius: 12px;
	animation: turn 2s ease-in-out infinite;
}

@keyframes turn {
	0%, 30% { transform: rotate(0deg); }
	60%, 100% { transform: rotate(-90deg); }
}

#rotate button {
	font: inherit;
	font-size: 18px;
	color: #100f23;
	background: #f2c14e;
	border: 0;
	border-radius: 999px;
	padding: 14px 26px;
	min-height: 48px;
	cursor: pointer;
}

#rotate small {
	color: #b9b4c9;
	font-size: 15px;
}

@media (orientation: portrait) and (max-width: 900px) {
	body:not(.rotate-dismissed) #rotate.ready {
		display: flex;
	}
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			This game needs JavaScript.
		</noscript>

		<div id="safe-probe"></div>

		<div id="status">
			<div class="door"><div class="leaf"></div></div>
			<div id="status-title">$GODOT_PROJECT_NAME</div>
			<div id="status-progress" class="indeterminate"><div id="status-bar"></div></div>
			<div id="status-notice"></div>
		</div>

		<div id="rotate">
			<div class="phone"></div>
			<div>Turn your phone sideways for the best fit.</div>
			<small id="rotate-tip"></small>
			<button id="rotate-dismiss" type="button">Play anyway</button>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	// --- Browser gesture suppression (pinch-zoom, double-tap zoom, context menu). ---
	const prevent = (e) => e.preventDefault();
	document.addEventListener('contextmenu', prevent);
	document.addEventListener('gesturestart', prevent, { passive: false });
	document.addEventListener('dblclick', prevent, { passive: false });
	document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) { e.preventDefault(); } }, { passive: false });

	// --- Safe-area insets, read by the game through window.__safeArea. ---
	const probe = document.getElementById('safe-probe');
	function readSafeArea() {
		const s = getComputedStyle(probe);
		window.__safeArea = {
			top: parseFloat(s.paddingTop) || 0,
			right: parseFloat(s.paddingRight) || 0,
			bottom: parseFloat(s.paddingBottom) || 0,
			left: parseFloat(s.paddingLeft) || 0,
		};
	}
	readSafeArea();
	window.addEventListener('resize', readSafeArea);
	window.addEventListener('orientationchange', readSafeArea);

	// --- Rotate hint for phones held upright; dismissable, the game still runs letterboxed. ---
	const rotate = document.getElementById('rotate');
	const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
	if (isIOS && !standalone) {
		document.getElementById('rotate-tip').textContent = 'Tip: Share → Add to Home Screen plays full screen and keeps your progress safe.';
	}
	document.getElementById('rotate-dismiss').addEventListener('click', () => {
		document.body.classList.add('rotate-dismissed');
	});

	// --- Loader ---
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusBar = document.getElementById('status-bar');
	const statusNotice = document.getElementById('status-notice');

	function hideStatus() {
		statusOverlay.classList.add('fade');
		setTimeout(() => statusOverlay.remove(), 450);
		rotate.classList.add('ready');
	}

	function displayFailureNotice(err) {
		console.error(err);
		const text = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.');
		statusProgress.style.display = 'none';
		statusNotice.style.display = 'block';
		statusNotice.textContent = text;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('This browser is missing features the game needs:\n' + missing.join('\n'));
		return;
	}

	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				statusProgress.classList.remove('indeterminate');
				statusBar.style.width = Math.min(100, (current / total) * 100) + '%';
			} else {
				statusProgress.classList.add('indeterminate');
			}
		},
	}).then(hideStatus, displayFailureNotice);
}());
		</script>
	</body>
</html>
