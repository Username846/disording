name: Deploy to GitHub Pages

# Renders the audio, exports the release + preview web builds, checks budgets,
# runs the browser smoke test and publishes build/site to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/songsmith/requirements.txt

      - run: pip install -r tools/songsmith/requirements.txt

      - name: Restore rendered audio
        uses: actions/cache@v4
        with:
          path: |
            generated
            tools/songsmith/songsmith/**/__pycache__
          key: songs-${{ hashFiles('tools/songsmith/songsmith/**/*.py', 'music/**/song.yaml', 'days/*/song.yaml') }}
          restore-keys: songs-

      - name: Render songs (only changed ones)
        run: PYTHONPATH=tools/songsmith python -m songsmith render --all --changed

      - name: Check songs
        run: PYTHONPATH=tools/songsmith python -m songsmith check --all

      - name: Cache Godot 4.7.2
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-stable-linux-web-v1

      - name: Fetch Godot 4.7.2
        run: python tools/ci/fetch_godot.py --dest ~/.local/bin

      - name: Godot tests
        run: GODOT=~/.local/bin/godot tools/ci/godot_tests.sh

      - name: Export web builds
        run: GODOT=~/.local/bin/godot tools/ci/build_web.sh

      - name: Size budgets
        run: python tools/ci/check_budgets.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Browser smoke test
        working-directory: tests/web
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node smoke.mjs ../../build/site --shots ../../build/shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/shots
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
